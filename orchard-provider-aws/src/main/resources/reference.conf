com.salesforce.mce.orchard {
    io.aws {
        logging.uri = ${?ORCHARD_AWS_LOGGING_URI}
        static.credentials {
            accessKeyId = ${?ORCHARD_AWS_ACCESS_KEY_ID}
            secretKey = ${?ORCHARD_AWS_SECRET_KEY}
        }
        assume.role.arn = ${?ORCHARD_ASSUME_ROLE_ARN}
        client.region = ${?ORCHARD_AWS_CLIENT_REGION}
        client.emr {
            retry {
                // Opt in to custom retries and the API-call timeout; otherwise keep SDK defaults.
                enabled = false
                enabled = ${?ORCHARD_AWS_EMR_RETRY_ENABLED}
                // Includes the initial request.
                maxAttempts = 6
                maxAttempts = ${?ORCHARD_AWS_EMR_RETRY_MAX_ATTEMPTS}
                baseDelay = 200 milliseconds
                baseDelay = ${?ORCHARD_AWS_EMR_RETRY_BASE_DELAY}
                maxBackoff = 10 seconds
                maxBackoff = ${?ORCHARD_AWS_EMR_RETRY_MAX_BACKOFF}
                throttlingBaseDelay = 2 seconds
                throttlingBaseDelay = ${?ORCHARD_AWS_EMR_RETRY_THROTTLING_BASE_DELAY}
                throttlingMaxBackoff = 30 seconds
                throttlingMaxBackoff = ${?ORCHARD_AWS_EMR_RETRY_THROTTLING_MAX_BACKOFF}
            }
            // Bounds one SDK operation including retries, not Orchard's outer retry loop.
            apiCallTimeout = 2 minutes
            apiCallTimeout = ${?ORCHARD_AWS_EMR_API_CALL_TIMEOUT}
        }
    }
}
